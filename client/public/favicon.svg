<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Глибокий темний фон -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a102f" />
      <stop offset="100%" stop-color="#0a0612" />
    </radialGradient>

    <!-- Неоновий фірмовий градієнт -->
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="45%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Неонове світіння -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Квадратна підкладка із закругленими кутами для фавікону -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="110" fill="none" stroke="url(#neonGradient)" stroke-width="8" opacity="0.4" />

  <!-- Геометричний символ: динамічні сходинки-кроки та стрілка назовні (Step + Out) -->
  <g filter="url(#neonGlow)">
    <!-- Сходинка 1 (База / Старт) -->
    <rect x="110" y="320" width="70" height="70" rx="16" fill="url(#neonGradient)" />

    <!-- Сходинка 2 (Рух угору) -->
    <rect x="195" y="235" width="70" height="155" rx="16" fill="url(#neonGradient)" />

    <!-- Сходинка 3 + Стрілка виходу на івенти (Step Out) -->
    <path d="M 280 150 
             C 280 141, 287 134, 296 134 
             L 370 134 
             C 385 134, 396 145, 396 160 
             L 396 234 
             C 396 243, 389 250, 380 250 
             L 365 250 
             C 356 250, 350 243, 350 234 
             L 350 196 
             L 248 298 
             C 242 304, 232 304, 226 298 
             L 214 286 
             C 208 280, 208 270, 214 264 
             L 316 162 
             L 296 162 
             C 287 162, 280 155, 280 146 
             Z" 
          fill="url(#neonGradient)" />

    <!-- Фокусна неонова точка події (Event Pin / Pulse) -->
    <circle cx="370" cy="160" r="14" fill="#ffffff" />
  </g>
</svg>
